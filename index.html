
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HopLog</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:#f7f5f2;font-family:'Inter',sans-serif;color:#1a1a1a;}
    input,textarea,button{font-family:'Inter',sans-serif;}
    ::-webkit-scrollbar{width:4px;}
    ::-webkit-scrollbar-track{background:#f7f5f2;}
    ::-webkit-scrollbar-thumb{background:#ddd;border-radius:4px;}
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .fade-in{animation:fadeIn .25s ease}
    @keyframes spin{to{transform:rotate(360deg)}}
    .spin{animation:spin 1s linear infinite;display:inline-block;}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ── Supabase ──────────────────────────────────────────────────────────────────
const SUPABASE_URL = "https://dzpyjvuoewswlmrehfhc.supabase.co";
const SUPABASE_KEY = "sb_publishable_W6fsf7rEi1earRIP-pH2zA__tV2107M";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ── Helpers ───────────────────────────────────────────────────────────────────
const avg = arr => arr.length ? (arr.reduce((s,v)=>s+v,0)/arr.length).toFixed(1) : null;
const fmtDate = iso => new Date(iso).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
const toBase64 = file => new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); });

// ── Avatar ────────────────────────────────────────────────────────────────────
function Avatar({username, color, size=32}){
  const letter = (username||"?")[0].toUpperCase();
  const bg = color || "#e8845c";
  return <div style={{width:size,height:size,borderRadius:"50%",background:bg,display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontWeight:600,fontSize:size*0.4,flexShrink:0}}>{letter}</div>;
}

// ── Stars ─────────────────────────────────────────────────────────────────────
function Stars({score, onChange, size=20}){
  const [hover,setHover]=useState(0);
  return <div style={{display:"flex",gap:2}}>
    {[1,2,3,4,5].map(n=>(
      <span key={n}
        onMouseEnter={()=>onChange&&setHover(n)}
        onMouseLeave={()=>onChange&&setHover(0)}
        onClick={()=>onChange&&onChange(n)}
        style={{fontSize:size,cursor:onChange?"pointer":"default",color:(hover||score)>=n?"#f59e0b":"#e5e7eb",transition:"color .1s"}}>★</span>
    ))}
  </div>;
}

// ── Spinner ───────────────────────────────────────────────────────────────────
function Spinner(){
  return <span className="spin" style={{display:"inline-block",width:18,height:18,border:"2px solid #f0ede8",borderTop:"2px solid #e8845c",borderRadius:"50%"}}/>;
}

// ── App ───────────────────────────────────────────────────────────────────────
function App(){
  const [me,setMe]           = useState(null);
  const [breweries,setBreweries] = useState([]);
  const [view,setView]       = useState("feed");
  const [selected,setSelected] = useState(null);
  const [loading,setLoading] = useState(true);

  const loadBreweries = async () => {
    const { data: bData } = await sb.from("breweries").select("*").order("added_at",{ascending:false});
    if (!bData) return;
    const { data: beers }    = await sb.from("beers").select("*");
    const { data: ratings }  = await sb.from("ratings").select("*");
    const { data: checkins } = await sb.from("checkins").select("*");
    const { data: comments } = await sb.from("comments").select("*").order("created_at",{ascending:true});
    const full = bData.map(b=>({
      ...b,
      beers: (beers||[]).filter(beer=>beer.brewery_id===b.id).map(beer=>({
        ...beer,
        ratings: (ratings||[]).filter(r=>r.beer_id===beer.id)
      })),
      checkins: (checkins||[]).filter(c=>c.brewery_id===b.id),
      comments: (comments||[]).filter(c=>c.brewery_id===b.id),
    }));
    setBreweries(full);
  };

  useEffect(()=>{ (async()=>{ await loadBreweries(); setLoading(false); })(); },[]);

  const handleLogout = () => { setMe(null); setView("feed"); };

  if(loading) return (
    <div style={{height:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",background:"#f7f5f2"}}>
      <div style={{fontSize:48,marginBottom:16}}>🍺</div>
      <Spinner/>
    </div>
  );
  if(!me) return <Login onLogin={u=>{setMe(u);loadBreweries();}}/>;

  const showNav = view!=="add" && view!=="detail";

  return (
    <div style={{background:"#f7f5f2",minHeight:"100vh",maxWidth:480,margin:"0 auto",display:"flex",flexDirection:"column"}}>
      <header style={{background:"#fff",borderBottom:"1px solid #f0ede8",padding:"14px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:20,boxShadow:"0 1px 8px rgba(0,0,0,.04)"}}>
        <span style={{fontFamily:"'Playfair Display',serif",fontSize:22,color:"#1a1a1a"}}>HopLog 🍺</span>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <Avatar username={me.username} color={me.color} size={32}/>
          <span style={{fontSize:13,fontWeight:500,color:"#555"}}>{me.username}</span>
          <button onClick={handleLogout} style={{background:"none",border:"1px solid #e5e7eb",color:"#888",borderRadius:8,padding:"4px 10px",fontSize:12,cursor:"pointer"}}>Out</button>
        </div>
      </header>

      <main style={{flex:1,overflowY:"auto",paddingBottom:88}}>
        {view==="feed"    && <Feed breweries={breweries} me={me} onSelect={b=>{setSelected(b);setView("detail");}} onRefresh={loadBreweries}/>}
        {view==="add"     && <AddBrewery me={me} onSave={async()=>{await loadBreweries();setView("feed");}} onCancel={()=>setView("feed")}/>}
        {view==="mybeers" && <MyBeers breweries={breweries} me={me}/>}
        {view==="detail"  && selected && <Detail
          brewery={breweries.find(b=>b.id===selected.id)||selected}
          me={me}
          onRefresh={async()=>{ await loadBreweries(); }}
          onBack={()=>setView("feed")}/>}
      </main>

      {showNav && (
        <nav style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:480,background:"#fff",borderTop:"1px solid #f0ede8",display:"flex",alignItems:"center",justifyContent:"space-around",height:68,zIndex:20,boxShadow:"0 -4px 20px rgba(0,0,0,.06)"}}>
          <button onClick={()=>setView("feed")} style={{background:"none",border:"none",display:"flex",flexDirection:"column",alignItems:"center",gap:3,cursor:"pointer",flex:1,color:view==="feed"?"#e8845c":"#bbb",fontSize:10,fontWeight:500}}>
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            Breweries
          </button>
          <button onClick={()=>setView("add")} style={{background:"#e8845c",border:"none",borderRadius:20,width:56,height:56,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",boxShadow:"0 4px 16px rgba(232,132,92,.4)",marginBottom:20,color:"#fff",fontSize:28}}>＋</button>
          <button onClick={()=>setView("mybeers")} style={{background:"none",border:"none",display:"flex",flexDirection:"column",alignItems:"center",gap:3,cursor:"pointer",flex:1,color:view==="mybeers"?"#e8845c":"#bbb",fontSize:10,fontWeight:500}}>
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 11l1.5 7H5.5L7 11"/><path d="M7 11V6a5 5 0 0 1 10 0v5"/><line x1="12" y1="6" x2="12" y2="11"/></svg>
            My Beers
          </button>
        </nav>
      )}
    </div>
  );
}

// ── Login ─────────────────────────────────────────────────────────────────────
function Login({onLogin}){
  const [user,setUser]=useState(""); const [pass,setPass]=useState(""); const [err,setErr]=useState(""); const [busy,setBusy]=useState(false);
  const submit=async()=>{
    if(!user.trim()||!pass.trim()){setErr("Please enter username and password.");return;}
    setBusy(true); setErr("");
    const {data,error}=await sb.from("users").select("*").eq("username",user.trim().toLowerCase()).eq("password",pass).single();
    setBusy(false);
    if(error||!data) setErr("Wrong username or password.");
    else onLogin(data);
  };
  const inp={width:"100%",border:"1.5px solid #f0ede8",borderRadius:12,padding:"12px 14px",fontSize:15,outline:"none",background:"#fafafa"};
  return (
    <div style={{minHeight:"100vh",background:"#f7f5f2",display:"flex",alignItems:"center",justifyContent:"center",padding:24}}>
      <div className="fade-in" style={{background:"#fff",borderRadius:24,padding:"40px 32px",width:"100%",maxWidth:380,boxShadow:"0 8px 40px rgba(0,0,0,.08)"}}>
        <div style={{textAlign:"center",marginBottom:32}}>
          <div style={{fontSize:52,marginBottom:12}}>🍺</div>
          <h1 style={{fontFamily:"'Playfair Display',serif",fontSize:30,color:"#1a1a1a",marginBottom:6}}>HopLog</h1>
          <p style={{color:"#999",fontSize:14}}>Your crew's brewery journal</p>
        </div>
        <div style={{marginBottom:16}}>
          <label style={{display:"block",fontSize:13,fontWeight:500,color:"#555",marginBottom:6}}>Username</label>
          <input value={user} onChange={e=>setUser(e.target.value)} placeholder="hophavoc" autoCapitalize="none" style={inp}
            onFocus={e=>e.target.style.borderColor="#e8845c"} onBlur={e=>e.target.style.borderColor="#f0ede8"}/>
        </div>
        <div style={{marginBottom:8}}>
          <label style={{display:"block",fontSize:13,fontWeight:500,color:"#555",marginBottom:6}}>Password</label>
          <input type="password" value={pass} onChange={e=>setPass(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()} placeholder="••••••••" style={inp}
            onFocus={e=>e.target.style.borderColor="#e8845c"} onBlur={e=>e.target.style.borderColor="#f0ede8"}/>
        </div>
        {err&&<p style={{color:"#ef4444",fontSize:13,marginBottom:8,textAlign:"center"}}>{err}</p>}
        <button onClick={submit} disabled={busy} style={{width:"100%",background:"#e8845c",color:"#fff",border:"none",borderRadius:12,padding:"14px 0",fontSize:15,fontWeight:600,cursor:"pointer",marginTop:8,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
          {busy?<Spinner/>:"Sign In"}
        </button>
      </div>
    </div>
  );
}

// ── Feed ──────────────────────────────────────────────────────────────────────
function Feed({breweries,me,onSelect,onRefresh}){
  const [search,setSearch]=useState("");
  const filtered=breweries.filter(b=>b.name.toLowerCase().includes(search.toLowerCase())||(b.city||"").toLowerCase().includes(search.toLowerCase()));
  return (
    <div style={{padding:"20px 16px"}} className="fade-in">
      <div style={{position:"relative",marginBottom:20}}>
        <svg style={{position:"absolute",left:14,top:"50%",transform:"translateY(-50%)",color:"#bbb"}} width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search breweries…"
          style={{width:"100%",background:"#fff",border:"1.5px solid #f0ede8",borderRadius:14,padding:"12px 14px 12px 40px",fontSize:14,outline:"none",boxShadow:"0 2px 8px rgba(0,0,0,.04)"}}
          onFocus={e=>e.target.style.borderColor="#e8845c"} onBlur={e=>e.target.style.borderColor="#f0ede8"}/>
      </div>
      {filtered.length===0&&(
        <div style={{textAlign:"center",padding:"60px 20px"}}>
          <div style={{fontSize:52,marginBottom:12}}>🏭</div>
          <p style={{color:"#999",fontSize:15}}>No breweries yet.</p>
          <p style={{color:"#bbb",fontSize:13,marginTop:4}}>Tap + to add your first one!</p>
        </div>
      )}
      {filtered.map(b=>{
        const ratings=(b.beers||[]).flatMap(beer=>(beer.ratings||[]).map(r=>r.score));
        const ov=avg(ratings); const ci=(b.checkins||[]).some(c=>c.user_id===me.id);
        return (
          <div key={b.id} onClick={()=>onSelect(b)} className="fade-in"
            style={{background:"#fff",borderRadius:20,marginBottom:14,cursor:"pointer",overflow:"hidden",boxShadow:"0 2px 12px rgba(0,0,0,.06)",transition:"transform .15s,box-shadow .15s"}}
            onMouseEnter={e=>{e.currentTarget.style.transform="translateY(-2px)";e.currentTarget.style.boxShadow="0 8px 24px rgba(0,0,0,.1)";}}
            onMouseLeave={e=>{e.currentTarget.style.transform="none";e.currentTarget.style.boxShadow="0 2px 12px rgba(0,0,0,.06)";}}>
            {b.photo?<img src={b.photo} alt={b.name} style={{width:"100%",height:160,objectFit:"cover"}}/>
              :<div style={{height:80,background:"linear-gradient(135deg,#fdf6ee,#fcecd8)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:36}}>🏭</div>}
            <div style={{padding:"14px 16px"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                <div>
                  <div style={{fontWeight:600,fontSize:16,color:"#1a1a1a",marginBottom:2}}>{b.name}</div>
                  <div style={{color:"#999",fontSize:13}}>{[b.city,b.state].filter(Boolean).join(", ")}</div>
                </div>
                <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:4}}>
                  {ov&&<div style={{background:"#fef3c7",color:"#d97706",fontSize:13,fontWeight:600,padding:"3px 8px",borderRadius:8}}>⭐ {ov}</div>}
                  {ci&&<div style={{background:"#d1fae5",color:"#059669",fontSize:11,fontWeight:500,padding:"2px 8px",borderRadius:8}}>✓ Visited</div>}
                </div>
              </div>
              <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:10}}>
                {b.style&&<span style={{background:"#f3f4f6",color:"#666",fontSize:11,padding:"3px 8px",borderRadius:8,fontWeight:500}}>{b.style}</span>}
                <span style={{background:"#f3f4f6",color:"#666",fontSize:11,padding:"3px 8px",borderRadius:8}}>🍺 {(b.beers||[]).length} beers</span>
                <span style={{background:"#f3f4f6",color:"#666",fontSize:11,padding:"3px 8px",borderRadius:8}}>👥 {(b.checkins||[]).length} visits</span>
                {b.lat&&b.lng&&<span style={{background:"#f3f4f6",color:"#666",fontSize:11,padding:"3px 8px",borderRadius:8}}>📍 Map</span>}
              </div>
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ── Add Brewery ───────────────────────────────────────────────────────────────
function AddBrewery({me,onSave,onCancel}){
  const [form,setForm]=useState({name:"",city:"",state:"",style:"",notes:""});
  const [photo,setPhoto]=useState(null); const [lat,setLat]=useState(""); const [lng,setLng]=useState("");
  const [gpsMsg,setGpsMsg]=useState(""); const [locMode,setLocMode]=useState("gps"); const [busy,setBusy]=useState(false);
  const fileRef=useRef(); const set=(k,v)=>setForm(f=>({...f,[k]:v}));
  const pickPhoto=async e=>{ const file=e.target.files[0]; if(!file)return; const img=new Image(); img.onload=()=>{ const MAX=800,s=Math.min(1,MAX/Math.max(img.width,img.height)),c=document.createElement("canvas"); c.width=img.width*s; c.height=img.height*s; c.getContext("2d").drawImage(img,0,0,c.width,c.height); setPhoto(c.toDataURL("image/jpeg",.75)); }; img.src=await toBase64(file); };
  const getGPS=()=>{ setGpsMsg("Getting location…"); navigator.geolocation.getCurrentPosition(p=>{setLat(p.coords.latitude.toFixed(6));setLng(p.coords.longitude.toFixed(6));setGpsMsg("✓ Got it!");},()=>setGpsMsg("Could not get location.")); };
  const save=async()=>{
    if(!form.name.trim())return;
    setBusy(true);
    const id=Date.now().toString();
    await sb.from("breweries").insert({id,...form,photo:photo||null,lat:lat?parseFloat(lat):null,lng:lng?parseFloat(lng):null,added_by:me.id,added_at:new Date().toISOString()});
    await onSave();
    setBusy(false);
  };
  const inp={width:"100%",border:"1.5px solid #f0ede8",borderRadius:12,padding:"12px 14px",fontSize:14,outline:"none",background:"#fafafa"};
  return (
    <div style={{padding:"20px 16px"}} className="fade-in">
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:24}}>
        <button onClick={onCancel} style={{background:"#f3f4f6",border:"none",borderRadius:10,width:36,height:36,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#666" strokeWidth="2.5"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <h2 style={{fontFamily:"'Playfair Display',serif",fontSize:22,color:"#1a1a1a"}}>Add Brewery</h2>
      </div>
      <div style={{marginBottom:20}}>
        <input ref={fileRef} type="file" accept="image/*" capture="environment" style={{display:"none"}} onChange={pickPhoto}/>
        {photo?<div style={{position:"relative",borderRadius:16,overflow:"hidden"}}><img src={photo} alt="preview" style={{width:"100%",height:180,objectFit:"cover"}}/><button onClick={()=>setPhoto(null)} style={{position:"absolute",top:10,right:10,background:"rgba(0,0,0,.5)",border:"none",color:"#fff",borderRadius:"50%",width:30,height:30,cursor:"pointer",fontSize:16}}>✕</button></div>
          :<button onClick={()=>fileRef.current.click()} style={{width:"100%",background:"#fafafa",border:"2px dashed #e5e7eb",borderRadius:16,padding:"28px 0",display:"flex",flexDirection:"column",alignItems:"center",gap:8,cursor:"pointer"}}><span style={{fontSize:32}}>📷</span><span style={{fontSize:13,color:"#999",fontWeight:500}}>Add a photo</span></button>}
      </div>
      {[["name","Brewery Name","e.g. Dogfish Head","*"],["city","City","e.g. Milton"],["state","State","e.g. DE"],["style","Type","e.g. Craft"]].map(([k,label,ph,req])=>(
        <div key={k} style={{marginBottom:16}}><label style={{display:"block",fontSize:13,fontWeight:500,color:"#555",marginBottom:6}}>{label}{req&&<span style={{color:"#e8845c"}}> *</span>}</label>
        <input style={inp} value={form[k]} onChange={e=>set(k,e.target.value)} placeholder={ph} onFocus={e=>e.target.style.borderColor="#e8845c"} onBlur={e=>e.target.style.borderColor="#f0ede8"}/></div>
      ))}
      <div style={{marginBottom:16}}>
        <label style={{display:"block",fontSize:13,fontWeight:500,color:"#555",marginBottom:8}}>📍 Location</label>
        <div style={{display:"flex",gap:8,marginBottom:10}}>{["gps","manual"].map(m=><button key={m} onClick={()=>setLocMode(m)} style={{flex:1,background:locMode===m?"#fff3ee":"#f3f4f6",border:locMode===m?"1.5px solid #e8845c":"1.5px solid transparent",color:locMode===m?"#e8845c":"#888",borderRadius:10,padding:"8px 0",fontSize:13,fontWeight:500,cursor:"pointer"}}>{m==="gps"?"📡 GPS":"✍️ Manual"}</button>)}</div>
        {locMode==="gps"&&<div><button onClick={getGPS} style={{width:"100%",background:"#fff3ee",border:"1.5px solid #e8845c",color:"#e8845c",borderRadius:12,padding:"11px 0",fontSize:14,fontWeight:500,cursor:"pointer",marginBottom:6}}>Get My Location</button>{gpsMsg&&<p style={{fontSize:13,color:gpsMsg.startsWith("✓")?"#059669":"#ef4444",textAlign:"center"}}>{gpsMsg}</p>}{lat&&lng&&<p style={{fontSize:12,color:"#999",textAlign:"center",marginTop:4}}>{lat}, {lng}</p>}</div>}
        {locMode==="manual"&&<div style={{display:"flex",gap:10}}><div style={{flex:1}}><label style={{fontSize:12,color:"#999",display:"block",marginBottom:4}}>Latitude</label><input style={inp} value={lat} onChange={e=>setLat(e.target.value)} placeholder="38.9072" onFocus={e=>e.target.style.borderColor="#e8845c"} onBlur={e=>e.target.style.borderColor="#f0ede8"}/></div><div style={{flex:1}}><label style={{fontSize:12,color:"#999",display:"block",marginBottom:4}}>Longitude</label><input style={inp} value={lng} onChange={e=>setLng(e.target.value)} placeholder="-77.0369" onFocus={e=>e.target.style.borderColor="#e8845c"} onBlur={e=>e.target.style.borderColor="#f0ede8"}/></div></div>}
      </div>
      <div style={{marginBottom:20}}><label style={{display:"block",fontSize:13,fontWeight:500,color:"#555",marginBottom:6}}>Notes</label><textarea style={{...inp,height:80,resize:"none"}} value={form.notes} onChange={e=>set("notes",e.target.value)} placeholder="Atmosphere, food, parking…" onFocus={e=>e.target.style.borderColor="#e8845c"} onBlur={e=>e.target.style.borderColor="#f0ede8"}/></div>
      <div style={{display:"flex",gap:10}}>
        <button onClick={onCancel} style={{flex:1,background:"#f3f4f6",border:"none",borderRadius:12,padding:"14px 0",fontSize:15,fontWeight:500,cursor:"pointer",color:"#666"}}>Cancel</button>
        <button onClick={save} disabled={busy} style={{flex:2,background:"#e8845c",border:"none",borderRadius:12,padding:"14px 0",fontSize:15,fontWeight:600,cursor:"pointer",color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>{busy?<Spinner/>:"Save Brewery"}</button>
      </div>
      <div style={{height:24}}/>
    </div>
  );
}

// ── Detail ────────────────────────────────────────────────────────────────────
function Detail({brewery:b,me,onRefresh,onBack}){
  const [tab,setTab]=useState("beers"); const [addingBeer,setAddingBeer]=useState(false); const [comment,setComment]=useState(""); const [busy,setBusy]=useState(false);
  const photoRef=useRef(); const checkedIn=(b.checkins||[]).some(c=>c.user_id===me.id);

  const checkIn=async()=>{
    if(checkedIn)return;
    await sb.from("checkins").insert({brewery_id:b.id,user_id:me.id,username:me.username});
    await onRefresh();
  };

  const addBeer=async beer=>{
    const id=Date.now().toString();
    await sb.from("beers").insert({id,brewery_id:b.id,name:beer.name,style:beer.style,abv:beer.abv,added_by:me.id,added_at:new Date().toISOString()});
    if(beer.score>0) await sb.from("ratings").insert({beer_id:id,user_id:me.id,username:me.username,score:beer.score,note:beer.note});
    await onRefresh();
    setAddingBeer(false);
  };

  const rateBeer=async(beerId,score,note)=>{
    await sb.from("ratings").delete().eq("beer_id",beerId).eq("user_id",me.id);
    await sb.from("ratings").insert({beer_id:beerId,user_id:me.id,username:me.username,score,note});
    await onRefresh();
  };

  const postComment=async()=>{
    if(!comment.trim())return;
    setBusy(true);
    await sb.from("comments").insert({id:Date.now().toString(),brewery_id:b.id,user_id:me.id,username:me.username,text:comment.trim()});
    await onRefresh();
    setComment(""); setBusy(false);
  };

  const changePhoto=async e=>{
    const file=e.target.files[0]; if(!file)return;
    const img=new Image(); img.onload=async()=>{ const MAX=800,s=Math.min(1,MAX/Math.max(img.width,img.height)),c=document.createElement("canvas"); c.width=img.width*s; c.height=img.height*s; c.getContext("2d").drawImage(img,0,0,c.width,c.height); const photo=c.toDataURL("image/jpeg",.75); await sb.from("breweries").update({photo}).eq("id",b.id); await onRefresh(); }; img.src=await toBase64(file);
  };

  const mapsUrl=b.lat&&b.lng?`https://www.google.com/maps/search/?api=1&query=${b.lat},${b.lng}`:b.name?`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(b.name+" "+(b.city||""))}`:null;
  const ratings=(b.beers||[]).flatMap(beer=>(beer.ratings||[]).map(r=>r.score)); const ov=avg(ratings);
  const inp={width:"100%",border:"1.5px solid #f0ede8",borderRadius:12,padding:"12px 14px",fontSize:14,outline:"none",background:"#fafafa"};

  return (
    <div className="fade-in">
      <div style={{position:"relative"}}>
        {b.photo?<img src={b.photo} alt={b.name} style={{width:"100%",height:220,objectFit:"cover"}}/>
          :<div style={{height:140,background:"linear-gradient(135deg,#fdf6ee,#fcecd8)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:52}}>🏭</div>}
        <button onClick={onBack} style={{position:"absolute",top:16,left:16,background:"rgba(255,255,255,.9)",border:"none",borderRadius:10,width:36,height:36,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 2px 8px rgba(0,0,0,.1)"}}>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#333" strokeWidth="2.5"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <button onClick={()=>photoRef.current.click()} style={{position:"absolute",bottom:12,right:12,background:"rgba(255,255,255,.9)",border:"none",borderRadius:10,padding:"6px 12px",fontSize:12,fontWeight:500,cursor:"pointer"}}>📷 {b.photo?"Change":"Add"}</button>
        <input ref={photoRef} type="file" accept="image/*" capture="environment" style={{display:"none"}} onChange={changePhoto}/>
      </div>
      <div style={{padding:"20px 16px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
          <div>
            <h2 style={{fontFamily:"'Playfair Display',serif",fontSize:24,color:"#1a1a1a",marginBottom:4}}>{b.name}</h2>
            <p style={{color:"#999",fontSize:14}}>{[b.city,b.state].filter(Boolean).join(", ")}</p>
          </div>
          {ov&&<div style={{background:"#fef3c7",color:"#d97706",fontSize:16,fontWeight:700,padding:"6px 12px",borderRadius:12}}>⭐ {ov}</div>}
        </div>
        {b.style&&<span style={{display:"inline-block",marginBottom:8,background:"#f3f4f6",color:"#666",fontSize:12,padding:"4px 10px",borderRadius:8,fontWeight:500}}>{b.style}</span>}
        {b.notes&&<p style={{color:"#777",fontSize:14,lineHeight:1.6,background:"#fafafa",borderRadius:12,padding:"10px 14px",marginBottom:12}}>{b.notes}</p>}
        {mapsUrl&&<a href={mapsUrl} target="_blank" rel="noopener noreferrer" style={{display:"flex",alignItems:"center",justifyContent:"center",gap:8,background:"#eff6ff",border:"1.5px solid #bfdbfe",color:"#3b82f6",borderRadius:12,padding:"12px 0",fontSize:14,fontWeight:500,textDecoration:"none",marginBottom:12}}>🗺 Open in Google Maps</a>}
        <button onClick={checkIn} disabled={checkedIn} style={{width:"100%",background:checkedIn?"#d1fae5":"#e8845c",border:"none",color:checkedIn?"#059669":"#fff",borderRadius:12,padding:"13px 0",fontSize:14,fontWeight:600,cursor:checkedIn?"default":"pointer",marginBottom:20,boxShadow:checkedIn?"none":"0 4px 16px rgba(232,132,92,.3)"}}>
          {checkedIn?"✓ You've visited this brewery":"📍 Check In"}
        </button>
        <div style={{display:"flex",background:"#f3f4f6",borderRadius:12,padding:4,marginBottom:20}}>
          {[["beers","🍺 Beers"],["checkins","📍 Visits"],["comments","💬 Notes"]].map(([k,label])=>(
            <button key={k} onClick={()=>setTab(k)} style={{flex:1,background:tab===k?"#fff":"transparent",border:"none",borderRadius:9,padding:"8px 0",fontSize:13,fontWeight:tab===k?600:400,color:tab===k?"#1a1a1a":"#888",cursor:"pointer",boxShadow:tab===k?"0 1px 4px rgba(0,0,0,.08)":"none",transition:"all .2s"}}>{label}</button>
          ))}
        </div>
        {tab==="beers"&&<div>
          {!addingBeer&&<button onClick={()=>setAddingBeer(true)} style={{width:"100%",background:"#fff3ee",border:"1.5px dashed #e8845c",color:"#e8845c",borderRadius:12,padding:"12px 0",fontSize:14,fontWeight:500,cursor:"pointer",marginBottom:14}}>+ Add Beer</button>}
          {addingBeer&&<AddBeer me={me} onSave={addBeer} onCancel={()=>setAddingBeer(false)}/>}
          {(b.beers||[]).length===0&&!addingBeer&&<p style={{textAlign:"center",color:"#bbb",padding:"24px 0",fontSize:14}}>No beers logged yet.</p>}
          {(b.beers||[]).map(beer=><BeerCard key={beer.id} beer={beer} me={me} onRate={(s,n)=>rateBeer(beer.id,s,n)}/>)}
        </div>}
        {tab==="checkins"&&<div>
          {(b.checkins||[]).length===0&&<p style={{textAlign:"center",color:"#bbb",padding:"24px 0",fontSize:14}}>No visits yet.</p>}
          {(b.checkins||[]).map((c,i)=>(
            <div key={i} style={{display:"flex",alignItems:"center",gap:12,background:"#fff",borderRadius:14,padding:"12px 14px",marginBottom:10,boxShadow:"0 1px 6px rgba(0,0,0,.05)"}}>
              <Avatar username={c.username} size={36}/>
              <div><div style={{fontWeight:500,fontSize:14}}>{c.username}</div><div style={{color:"#bbb",fontSize:12}}>{fmtDate(c.created_at)}</div></div>
              <span style={{marginLeft:"auto",background:"#d1fae5",color:"#059669",fontSize:12,fontWeight:500,padding:"3px 8px",borderRadius:8}}>✓ Visited</span>
            </div>
          ))}
        </div>}
        {tab==="comments"&&<div>
          <div style={{display:"flex",gap:10,marginBottom:16}}>
            <textarea value={comment} onChange={e=>setComment(e.target.value)} placeholder="Share your thoughts…" style={{...inp,height:72,resize:"none",flex:1}} onFocus={e=>e.target.style.borderColor="#e8845c"} onBlur={e=>e.target.style.borderColor="#f0ede8"}/>
            <button onClick={postComment} disabled={busy} style={{background:"#e8845c",border:"none",borderRadius:12,padding:"0 16px",color:"#fff",fontWeight:600,fontSize:14,cursor:"pointer",display:"flex",alignItems:"center"}}>{busy?<Spinner/>:"Post"}</button>
          </div>
          {(b.comments||[]).length===0&&<p style={{textAlign:"center",color:"#bbb",padding:"24px 0",fontSize:14}}>No notes yet.</p>}
          {(b.comments||[]).map(c=>(
            <div key={c.id} style={{background:"#fff",borderRadius:14,padding:"14px",marginBottom:10,boxShadow:"0 1px 6px rgba(0,0,0,.05)"}}>
              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
                <Avatar username={c.username} size={28}/>
                <span style={{fontWeight:500,fontSize:13}}>{c.username}</span>
                <span style={{marginLeft:"auto",color:"#bbb",fontSize:12}}>{fmtDate(c.created_at)}</span>
              </div>
              <p style={{color:"#555",fontSize:14,lineHeight:1.6}}>{c.text}</p>
            </div>
          ))}
        </div>}
      </div>
      <div style={{height:24}}/>
    </div>
  );
}

// ── Add Beer ──────────────────────────────────────────────────────────────────
function AddBeer({me,onSave,onCancel}){
  const [form,setForm]=useState({name:"",style:"",abv:""}); const [score,setScore]=useState(0); const [note,setNote]=useState(""); const [busy,setBusy]=useState(false);
  const inp={width:"100%",border:"1.5px solid #f0ede8",borderRadius:12,padding:"12px 14px",fontSize:14,outline:"none",background:"#fafafa"};
  const save=async()=>{ if(!form.name.trim())return; setBusy(true); await onSave({...form,score,note}); setBusy(false); };
  return (
    <div style={{background:"#fff",borderRadius:16,padding:16,marginBottom:16,boxShadow:"0 2px 12px rgba(0,0,0,.06)"}}>
      <h3 style={{fontWeight:600,fontSize:15,color:"#1a1a1a",marginBottom:14}}>New Beer</h3>
      {[["name","Beer Name","e.g. Sixty Minute IPA"],["style","Style","e.g. IPA"],["abv","ABV %","e.g. 6.0"]].map(([k,label,ph])=>(
        <div key={k} style={{marginBottom:12}}><label style={{display:"block",fontSize:12,fontWeight:500,color:"#888",marginBottom:5}}>{label}</label>
        <input style={inp} value={form[k]} onChange={e=>setForm(f=>({...f,[k]:e.target.value}))} placeholder={ph} onFocus={e=>e.target.style.borderColor="#e8845c"} onBlur={e=>e.target.style.borderColor="#f0ede8"}/></div>
      ))}
      <div style={{marginBottom:12}}><label style={{display:"block",fontSize:12,fontWeight:500,color:"#888",marginBottom:8}}>Your Rating</label><Stars score={score} onChange={setScore} size={28}/></div>
      <div style={{marginBottom:14}}><label style={{display:"block",fontSize:12,fontWeight:500,color:"#888",marginBottom:5}}>Tasting Note</label><input style={inp} value={note} onChange={e=>setNote(e.target.value)} placeholder="Hoppy, citrusy…" onFocus={e=>e.target.style.borderColor="#e8845c"} onBlur={e=>e.target.style.borderColor="#f0ede8"}/></div>
      <div style={{display:"flex",gap:8}}>
        <button onClick={onCancel} style={{flex:1,background:"#f3f4f6",border:"none",borderRadius:10,padding:"11px 0",fontSize:14,fontWeight:500,cursor:"pointer",color:"#666"}}>Cancel</button>
        <button onClick={save} disabled={busy} style={{flex:2,background:"#e8845c",border:"none",borderRadius:10,padding:"11px 0",fontSize:14,fontWeight:600,cursor:"pointer",color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>{busy?<Spinner/>:"Add Beer"}</button>
      </div>
    </div>
  );
}

// ── Beer Card ─────────────────────────────────────────────────────────────────
function BeerCard({beer,me,onRate}){
  const [editing,setEditing]=useState(false); const [score,setScore]=useState(0); const [note,setNote]=useState(""); const [busy,setBusy]=useState(false);
  const myRating=(beer.ratings||[]).find(r=>r.user_id===me.id); const allRatings=beer.ratings||[]; const avgScore=avg(allRatings.map(r=>r.score));
  const inp={width:"100%",border:"1.5px solid #f0ede8",borderRadius:12,padding:"12px 14px",fontSize:14,outline:"none",background:"#fafafa"};
  return (
    <div style={{background:"#fff",borderRadius:14,padding:"14px 16px",marginBottom:10,boxShadow:"0 1px 6px rgba(0,0,0,.05)"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
        <div><div style={{fontWeight:600,fontSize:15,color:"#1a1a1a"}}>{beer.name}</div><div style={{color:"#bbb",fontSize:12,marginTop:2}}>{[beer.style,beer.abv?"ABV "+beer.abv+"%":null].filter(Boolean).join(" · ")}</div></div>
        {avgScore&&<div style={{background:"#fef3c7",color:"#d97706",fontSize:13,fontWeight:600,padding:"3px 8px",borderRadius:8}}>⭐ {avgScore}</div>}
      </div>
      {allRatings.map(r=>(
        <div key={r.id} style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
          <Avatar username={r.username} size={22}/>
          <span style={{fontSize:12,color:"#888",fontWeight:500}}>{r.username}</span>
          <Stars score={r.score} size={13}/>
          {r.note&&<span style={{fontSize:12,color:"#bbb",fontStyle:"italic"}}>"{r.note}"</span>}
        </div>
      ))}
      {!myRating&&!editing&&<button onClick={()=>setEditing(true)} style={{marginTop:6,background:"#fff3ee",border:"1.5px solid #e8845c",color:"#e8845c",borderRadius:8,padding:"6px 14px",fontSize:13,fontWeight:500,cursor:"pointer"}}>Rate this beer</button>}
      {editing&&<div style={{marginTop:10,background:"#fafafa",borderRadius:12,padding:12}}>
        <div style={{marginBottom:10}}><Stars score={score} onChange={setScore} size={26}/></div>
        <input style={{...inp,marginBottom:10}} value={note} onChange={e=>setNote(e.target.value)} placeholder="Tasting note…" onFocus={e=>e.target.style.borderColor="#e8845c"} onBlur={e=>e.target.style.borderColor="#f0ede8"}/>
        <div style={{display:"flex",gap:8}}>
          <button onClick={()=>setEditing(false)} style={{flex:1,background:"#f3f4f6",border:"none",borderRadius:10,padding:"9px 0",fontSize:13,cursor:"pointer",color:"#666"}}>Cancel</button>
          <button onClick={async()=>{if(score>0){setBusy(true);await onRate(score,note);setEditing(false);setBusy(false);}}} disabled={busy} style={{flex:2,background:"#e8845c",border:"none",borderRadius:10,padding:"9px 0",fontSize:13,fontWeight:600,cursor:"pointer",color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>{busy?<Spinner/>:"Submit"}</button>
        </div>
      </div>}
    </div>
  );
}

// ── My Beers ──────────────────────────────────────────────────────────────────
function MyBeers({breweries,me}){
  const [filter,setFilter]=useState("all");
  const myBeers=breweries.flatMap(brewery=>(brewery.beers||[]).flatMap(beer=>{
    const myRating=(beer.ratings||[]).find(r=>r.user_id===me.id);
    if(!myRating)return [];
    return [{...beer,myRating,breweryName:brewery.name}];
  })).filter(b=>filter==="all"||b.myRating.score===parseInt(filter))
   .sort((a,b)=>b.myRating.score-a.myRating.score||new Date(b.myRating.created_at)-new Date(a.myRating.created_at));
  const total=myBeers.length;
  const avgAll=total?(myBeers.reduce((s,b)=>s+b.myRating.score,0)/total).toFixed(1):"-";
  const topScore=total?myBeers[0].myRating.score:"-";
  return (
    <div style={{padding:"20px 16px"}} className="fade-in">
      <h2 style={{fontFamily:"'Playfair Display',serif",fontSize:22,color:"#1a1a1a",marginBottom:4}}>My Beer Journal</h2>
      <p style={{color:"#999",fontSize:13,marginBottom:20}}>Beers you've personally rated</p>
      <div style={{display:"flex",gap:10,marginBottom:20}}>
        {[["🍺",total,"Beers rated"],["⭐",avgAll,"Avg rating"],["🏆",topScore>0?topScore+"/5":"-","Top score"]].map(([icon,val,label])=>(
          <div key={label} style={{flex:1,background:"#fff",borderRadius:14,padding:"12px 10px",textAlign:"center",boxShadow:"0 2px 8px rgba(0,0,0,.05)"}}>
            <div style={{fontSize:20,marginBottom:4}}>{icon}</div>
            <div style={{fontWeight:700,fontSize:18,color:"#1a1a1a"}}>{val}</div>
            <div style={{fontSize:11,color:"#bbb",marginTop:2}}>{label}</div>
          </div>
        ))}
      </div>
      <div style={{display:"flex",gap:8,marginBottom:16,overflowX:"auto",paddingBottom:4}}>
        {[["all","All"],["5","★★★★★"],["4","★★★★"],["3","★★★"],["2","★★"],["1","★"]].map(([val,label])=>(
          <button key={val} onClick={()=>setFilter(val)} style={{background:filter===val?"#e8845c":"#fff",border:filter===val?"none":"1px solid #f0ede8",color:filter===val?"#fff":"#888",borderRadius:20,padding:"6px 14px",fontSize:12,fontWeight:500,cursor:"pointer",whiteSpace:"nowrap"}}>{label}</button>
        ))}
      </div>
      {myBeers.length===0&&<div style={{textAlign:"center",padding:"48px 20px"}}><div style={{fontSize:48,marginBottom:12}}>🍺</div><p style={{color:"#999",fontSize:15}}>No rated beers yet.</p><p style={{color:"#bbb",fontSize:13,marginTop:4}}>Go rate some beers!</p></div>}
      {myBeers.map(beer=>(
        <div key={beer.id} style={{background:"#fff",borderRadius:16,padding:"14px 16px",marginBottom:10,boxShadow:"0 2px 8px rgba(0,0,0,.05)",display:"flex",alignItems:"center",gap:14}}>
          <div style={{width:48,height:48,borderRadius:14,background:beer.myRating.score>=4?"#fef3c7":beer.myRating.score===3?"#f3f4f6":"#fff5f5",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",flexShrink:0}}>
            <div style={{fontSize:18,fontWeight:700,color:beer.myRating.score>=4?"#d97706":beer.myRating.score===3?"#888":"#ef4444",lineHeight:1}}>{beer.myRating.score}</div>
            <div style={{fontSize:9,color:"#bbb",marginTop:1}}>/ 5</div>
          </div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontWeight:600,fontSize:15,color:"#1a1a1a",marginBottom:2,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{beer.name}</div>
            <div style={{color:"#bbb",fontSize:12,marginBottom:4}}>{[beer.style,beer.abv?"ABV "+beer.abv+"%":null].filter(Boolean).join(" · ")}</div>
            <div style={{display:"flex",alignItems:"center",gap:6}}><Stars score={beer.myRating.score} size={11}/><span style={{fontSize:11,color:"#bbb"}}>· {beer.breweryName}</span></div>
            {beer.myRating.note&&<p style={{fontSize:12,color:"#999",fontStyle:"italic",marginTop:4}}>"{beer.myRating.note}"</p>}
          </div>
          <div style={{fontSize:11,color:"#ccc",flexShrink:0}}>{fmtDate(beer.myRating.created_at)}</div>
        </div>
      ))}
      <div style={{height:20}}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
